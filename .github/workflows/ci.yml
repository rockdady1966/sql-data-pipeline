name: WWI Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "StrongTestPassword!2026"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Microsoft ODBC Driver 18 & sqlcmd
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/keys/microsoft-rolling.asc | sudo gpg --batch --yes --dearmor >> /usr/share/keyrings/microsoft-prod.gpg
          sudo chmod 644 /usr/share/keyrings/microsoft-prod.gpg
          sudo rm -f /etc/apt/sources.list.d/mssql-release.list
          UBUNTU_VER=$(. /etc/os-release && echo "$VERSION_ID")
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          if [ ! -f "/etc/apt/sources.list.d/microsoft-prod.list" ] && ! grep -rq "packages.microsoft.com/ubuntu/${UBUNTU_VER}/prod" /etc/apt/sources.list.d/; then
            echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${UBUNTU_VER}/prod ${CODENAME} main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> $GITHUB_PATH

      - name: Install Python dependencies
        working-directory: python_projects/wwi-pipeline
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install . python-dotenv pytest ruff
          elif [ -f ../../pyproject.toml ]; then
            pip install ../../ python-dotenv pytest ruff
          else
            pip install python-dotenv pytest ruff
          fi

      - name: Lint with ruff
        working-directory: python_projects/wwi-pipeline
        run: ruff check .

      - name: Run unit tests
        working-directory: python_projects/wwi-pipeline
        run: pytest -v tests/test_pipeline.py -k "not integration"

      - name: Wait for SQL Server & provision ETL objects
        working-directory: python_projects/wwi-pipeline
        env:
          SA_PASSWORD: "StrongTestPassword!2026"
        run: |
          SQLCMD_BIN="sqlcmd"
          if ! command -v sqlcmd >/dev/null 2>&1 && [ -x "/opt/mssql-tools18/bin/sqlcmd" ]; then
            SQLCMD_BIN="/opt/mssql-tools18/bin/sqlcmd"
          fi
          for i in {1..30}; do
            if "$SQLCMD_BIN" -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              break
            fi
            sleep 2
          done
          "$SQLCMD_BIN" -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q "IF DB_ID(N'WideWorldImportersDW') IS NULL CREATE DATABASE [WideWorldImportersDW];"
          "$SQLCMD_BIN" -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i sql/setup_etl.sql


      - name: Run DW integration tests
        working-directory: python_projects/wwi-pipeline
        env:
          DB_ODBC_DRIVER: "ODBC Driver 18 for SQL Server"
          TEST_DW_CONN_STR: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=WideWorldImportersDW;UID=sa;PWD=StrongTestPassword!2026;TrustServerCertificate=yes;"
        run: pytest -v tests/test_pipeline.py -k "integration"